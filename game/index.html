<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Runner - Desta Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      border: 3px solid #e94560;
      border-radius: 8px;
      background: #16213e;
      max-width: 100%;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      text-align: center;
      pointer-events: none;
    }
    #score {
      font-size: 24px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    #startScreen, #gameOverScreen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
    }
    #gameOverScreen { display: none; }
    h1 { font-size: 36px; margin-bottom: 10px; color: #e94560; }
    h2 { font-size: 28px; margin-bottom: 10px; color: #e94560; }
    p { font-size: 16px; margin-bottom: 20px; opacity: 0.8; }
    .btn {
      padding: 12px 30px;
      font-size: 18px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      pointer-events: all;
      transition: transform 0.2s, background 0.2s;
    }
    .btn:hover { background: #c73e54; transform: scale(1.05); }
    .btn:active { transform: scale(0.95); }
    #finalScore { font-size: 20px; margin: 15px 0; }
  </style>
</head>
<body>
  <canvas id="game" width="400" height="500"></canvas>
  
  <div id="ui">
    <div id="score">Score: 0</div>
  </div>

  <div id="startScreen">
    <h1>🏃 Runner</h1>
    <p>Lompati rintangan sebanyak mungkin!</p>
    <p style="font-size:12px">SPACE / TAP = Lompat</p>
    <button class="btn" onclick="startGame()">MAIN</button>
  </div>

  <div id="gameOverScreen">
    <h2>GAME OVER</h2>
    <div id="finalScore">Score: 0</div>
    <button class="btn" onclick="startGame()">LAGI</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreEl = document.getElementById('finalScore');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(freq, type, duration, volume = 0.3) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(volume, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function jumpSound() { playSound(400, 'square', 0.1); playSound(600, 'square', 0.1); }
    function scoreSound() { playSound(523, 'sine', 0.15); setTimeout(() => playSound(659, 'sine', 0.15), 100); setTimeout(() => playSound(784, 'sine', 0.2), 200); }
    function hitSound() { playSound(200, 'sawtooth', 0.3, 0.4); playSound(150, 'sawtooth', 0.4, 0.3); }

    let player, obstacles, particles, score, gameSpeed, isRunning, frameCount;

    function init() {
      player = {
        x: 60,
        y: 380,
        w: 30,
        h: 40,
        vy: 0,
        grounded: true,
        color: '#e94560'
      };
      obstacles = [];
      particles = [];
      score = 0;
      gameSpeed = 4;
      isRunning = false;
      frameCount = 0;
    }

    function spawnObstacle() {
      const h = 25 + Math.random() * 35;
      obstacles.push({
        x: canvas.width,
        y: 420 - h,
        w: 20 + Math.random() * 15,
        h: h,
        color: '#ff6b35'
      });
    }

    function spawnParticle(x, y) {
      for (let i = 0; i < 5; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 1) * 3,
          life: 30,
          color: '#e94560'
        });
      }
    }

    function jump() {
      if (player.grounded) {
        player.vy = -12;
        player.grounded = false;
        spawnParticle(player.x, player.y + player.h);
        jumpSound();
      }
    }

    function update() {
      if (!isRunning) return;

      frameCount++;
      if (frameCount % 90 === 0) {
        score++;
        gameSpeed += 0.15;
        scoreSound();
      }

      // Player physics
      player.vy += 0.6;
      player.y += player.vy;
      if (player.y >= 380) {
        player.y = 380;
        player.vy = 0;
        player.grounded = true;
      }

      // Obstacles
      if (frameCount % Math.max(50, 80 - Math.floor(score / 5)) === 0) {
        spawnObstacle();
      }
      for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= gameSpeed;
        if (obstacles[i].x + obstacles[i].w < 0) {
          obstacles.splice(i, 1);
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].x += particles[i].vx;
        particles[i].y += particles[i].vy;
        particles[i].life--;
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      // Collision
      for (let obs of obstacles) {
        if (
          player.x < obs.x + obs.w &&
          player.x + player.w > obs.x &&
          player.y < obs.y + obs.h &&
          player.y + player.h > obs.y + 10
        ) {
          gameOver();
          return;
        }
      }

      scoreEl.textContent = 'Score: ' + score;
    }

    function drawGround() {
      ctx.fillStyle = '#533483';
      ctx.fillRect(0, 420, canvas.width, 80);
      // Grass line
      ctx.fillStyle = '#e94560';
      ctx.fillRect(0, 418, canvas.width, 4);
    }

    function drawPlayer() {
      // Body
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x + 5, player.y + 12, 20, 20);
      // Head
      ctx.beginPath();
      ctx.arc(player.x + 15, player.y + 8, 10, 0, Math.PI * 2);
      ctx.fill();
      // Legs animation
      const legOffset = player.grounded ? Math.sin(frameCount * 0.3) * 5 : 5;
      ctx.fillRect(player.x + 8, player.y + 32, 6, 8 + legOffset);
      ctx.fillRect(player.x + 18, player.y + 32, 6, 8 - legOffset);
    }

    function drawObstacles() {
      for (let obs of obstacles) {
        ctx.fillStyle = obs.color;
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        // Spike top
        ctx.beginPath();
        ctx.moveTo(obs.x, obs.y);
        ctx.lineTo(obs.x + obs.w / 2, obs.y - 8);
        ctx.lineTo(obs.x + obs.w, obs.y);
        ctx.fill();
      }
    }

    function drawParticles() {
      for (let p of particles) {
        ctx.globalAlpha = p.life / 30;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4, 4);
      }
      ctx.globalAlpha = 1;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Background stars
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      for (let i = 0; i < 20; i++) {
        const sx = (i * 67 + frameCount * 0.5) % canvas.width;
        const sy = (i * 43) % 300;
        ctx.fillRect(sx, sy, 2, 2);
      }

      drawGround();
      drawObstacles();
      drawPlayer();
      drawParticles();
    }

    function gameLoop() {
      update();
      draw();
      if (isRunning) requestAnimationFrame(gameLoop);
    }

    function gameOver() {
      isRunning = false;
      hitSound();
      finalScoreEl.textContent = 'Score: ' + score;
      gameOverScreen.style.display = 'block';
    }

    function startGame() {
      audioCtx.resume();
      init();
      startScreen.style.display = 'none';
      gameOverScreen.style.display = 'none';
      isRunning = true;
      gameLoop();
    }

    // Controls
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        jump();
      }
    });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      jump();
    });

    canvas.addEventListener('click', () => jump());

    init();
    draw();
  </script>
</body>
</html>
